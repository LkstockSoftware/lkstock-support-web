<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LkStock Soporte</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="LkStockSupportWeb.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app" class="panel-loading" role="status" aria-live="polite">
        <div class="panel-loading-card">
            <div class="panel-loading-mark">LK</div>
            <div class="panel-loading-spinner"></div>
            <strong>Cargando centro de soporte</strong>
            <span>Preparando el panel seguro...</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="auth.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            let reloadingForUpdate = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!reloadingForUpdate) { reloadingForUpdate = true; window.location.reload(); }
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(registration => registration.update());
        }
    </script>
</body>

</html>
